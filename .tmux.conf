set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g status-position top
set -g status-justify absolute-centre
set -g status-left ""
set -g status-right ""
set -g status-style bg=default
set -g window-status-style "fg=#74737c"
set -g window-status-current-style "fg=#c4dfee"
set -g renumber-windows on
set -s escape-time 0
set -g base-index 1
set -g mouse on
bind -n C-h if -F '#{==:#{session_windows},1}' "" "previous-window"
bind -n C-l if -F '#{==:#{session_windows},1}' "" "next-window"
