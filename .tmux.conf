set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g status-position bottom
set -g status-justify left
set -g status-left ""
set -g status-right ""
set -g status-style bg="#3c3836"
set -g window-status-style "fg=#83766c"
set -g window-status-current-style "fg=#ddc7a1"
set -g renumber-windows on
set -s escape-time 0
set -g base-index 1
set -g mouse on

bind -n C-h if -F '#{==:#{session_windows},1}' "" "previous-window"
bind -n C-l if -F '#{==:#{session_windows},1}' "" "next-window"

set -g window-status-current-format " #I:#W"
set -g window-status-format " #I:#W"
