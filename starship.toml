format = "$directory$git_branch$character"
add_newline = false

[line_break]
disabled = true

[directory]
style = "fg:#e0a5a2"
truncate_to_repo = false
truncation_length = 0

[git_branch]
format = "[git:\\(](fg:#add3db)[$branch](fg:#de7f9c)[\\)](fg:#add3db) "
style = "fg:#d8a657"

[character]
success_symbol = "[\\$](fg:white) "
error_symbol = "[\\$](fg:white) "

[cmd_duration]
disabled = true

[package]
disabled = true

[git_status]
disabled = true

[rust]
disabled = true
